name: ARGOS Infrastructure Alert Relay CI

on:
  pull_request:
    paths:
      - 'api/argos-infrastructure-alert-relay.js'
      - 'tests/argos-infrastructure-alert-relay.test.js'
      - 'package.json'
      - '.github/workflows/argos-infrastructure-alert-relay-ci.yml'
  push:
    branches: [main]
    paths:
      - 'api/argos-infrastructure-alert-relay.js'
      - 'tests/argos-infrastructure-alert-relay.test.js'
      - 'package.json'
      - '.github/workflows/argos-infrastructure-alert-relay-ci.yml'

permissions:
  contents: read

jobs:
  relay-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: node --check api/argos-infrastructure-alert-relay.js
      - run: node --test tests/argos-infrastructure-alert-relay.test.js
